<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎁 投票抽奖 · 云帐房 WorkBuddy 实战应用大赛</title>
<script src="https://g.alicdn.com/dingding/dingtalk-jsapi/3.1.0/dingtalk.open.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f3f4f6; color: #1f2937; min-height: 100vh; }
  .topbar { background: linear-gradient(135deg, #ff6b35, #e55d2b); color: #fff; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .topbar h1 { font-size: 18px; font-weight: 700; }
  .topbar a { color: #fff; text-decoration: none; font-size: 13px; background: rgba(255,255,255,.18); padding: 6px 14px; border-radius: 16px; }
  .wrap { max-width: 800px; margin: 22px auto; padding: 0 16px; padding-bottom: 60px; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .stat { background: #fff; border-radius: 12px; padding: 18px 20px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .stat .num { font-size: 28px; font-weight: 800; color: #ff6b35; }
  .stat .lab { font-size: 12px; color: #6b7280; margin-top: 4px; }
  .card { background: #fff; border-radius: 14px; padding: 20px 22px; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card h2 { font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .rules { font-size: 13px; color: #4b5563; line-height: 1.8; white-space: pre-wrap; }
  .stage-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .stage-tab { padding: 8px 16px; border-radius: 20px; border: 1px solid #e5e7eb; background: #fff; color: #6b7280; font-size: 13px; cursor: pointer; }
  .stage-tab.active { background: #ff6b35; color: #fff; border-color: #ff6b35; }
  .stage-tab:disabled { opacity: .5; cursor: not-allowed; }
  .stage-info { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; font-size: 13px; color: #6b7280; }
  .stage-info span { background: #f9fafb; padding: 6px 12px; border-radius: 8px; }
  .draw-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(135deg, #ff6b35, #e55d2b); color: #fff; border: none; padding: 14px 36px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 24px rgba(255,107,53,.25); transition: transform .15s; }
  .draw-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .draw-btn:disabled { background: #d1d5db; box-shadow: none; cursor: not-allowed; }
  .winner-ticker { background: linear-gradient(90deg, #fff7ed, #fff); border-bottom: 1px solid #fed7aa; overflow: hidden; position: relative; height: 44px; display: flex; align-items: center; }
  .winner-ticker .label { flex: 0 0 auto; background: #ff6b35; color: #fff; font-size: 13px; font-weight: 700; padding: 0 16px; height: 100%; display: flex; align-items: center; z-index: 2; }
  .winner-ticker .track { flex: 1; overflow: hidden; position: relative; height: 100%; }
  .winner-ticker .items { display: inline-flex; white-space: nowrap; position: absolute; left: 100%; top: 0; height: 100%; align-items: center; animation: tickerScroll 30s linear infinite; }
  .winner-ticker .item { display: inline-flex; align-items: center; gap: 6px; margin-right: 48px; font-size: 13px; color: #7c2d12; }
  .winner-ticker .item span { color: #ff6b35; font-weight: 700; }
  @keyframes tickerScroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
  .winner-ticker:empty, .winner-ticker.no-wins { display: none; }
  .records { margin-top: 16px; }
  .record-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f3f4f6; font-size: 13px; }
  .record-item:last-child { border-bottom: none; }
  .record-item .time { color: #9ca3af; font-size: 12px; margin-left: auto; }
  .win { color: #e55d2b; font-weight: 700; }
  .empty { text-align: center; padding: 50px 20px; color: #6b7280; }
  .empty .big { font-size: 40px; margin-bottom: 12px; }
  .loading { text-align: center; padding: 60px; color: #9ca3af; }
  .login-box { text-align: center; padding: 60px 20px; }
  .login-box button { background: #ff6b35; color: #fff; border: none; padding: 12px 28px; border-radius: 10px; font-size: 15px; cursor: pointer; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(17,24,39,.55); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal { background: #fff; border-radius: 20px; max-width: 360px; width: 100%; padding: 32px 24px; text-align: center; box-shadow: 0 25px 80px rgba(0,0,0,.2); }
  .modal .icon { font-size: 56px; margin-bottom: 12px; }
  .modal h3 { font-size: 20px; margin-bottom: 8px; }
  .modal p { font-size: 14px; color: #6b7280; margin-bottom: 20px; line-height: 1.6; }
  .modal .prize-name { font-size: 24px; font-weight: 800; color: #ff6b35; margin-bottom: 16px; }
  .modal button { background: #ff6b35; color: #fff; border: none; padding: 10px 28px; border-radius: 10px; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>🎁 投票抽奖</h1>
    <a href="index.html">← 返回竞赛大厅</a>
  </div>
  <div class="winner-ticker" id="winnerTicker" style="display:none;">
    <div class="label">🎉 最新中奖</div>
    <div class="track"><div class="items" id="winnerItems"></div></div>
  </div>
  <div class="wrap">
    <div id="root"><div class="loading">加载中…</div></div>
  </div>

  <div class="modal-overlay" id="resultModal" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="icon" id="resultIcon">🎉</div>
      <h3 id="resultTitle">恭喜中奖</h3>
      <div class="prize-name" id="resultPrize"></div>
      <p id="resultDesc"></p>
      <button onclick="closeModal()">知道了</button>
    </div>
  </div>

<script>
const ESC = s => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STAGE_LABELS = { preliminary: '初赛', semi_final: '复赛', final: '决赛' };

let drawData = null;
let currentStageTab = '';
let recentWins = [];
let tickerPrizeStats = {};
let tickerSignature = '';

async function api(url, options) {
  options = options || {};
  options.credentials = 'include';
  const resp = await fetch(url, options);
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || '请求失败');
  return data;
}

function isInDingTalk() {
  try { return typeof dd !== 'undefined' && dd.env && dd.env.platform && dd.env.platform !== 'notInDingTalk'; } catch(e) { return false; }
}
function getCorpId() {
  const params = new URLSearchParams(window.location.search);
  return params.get('corpId') || params.get('corpid') || '';
}
async function ddLogin() {
  const corpId = isInDingTalk() ? getCorpId() : '';
  if (corpId) {
    dd.ready(function() {
      dd.runtime.permission.requestAuthCode({
        corpId: corpId,
        onSuccess: function(result) { exchangeCode(result.code); },
        onFail: function(err) { console.error(err); alert('获取钉钉授权失败，请重试'); }
      });
    });
    return;
  }
  try {
    const resp = await fetch('/api/auth/dd-url?redirect=' + encodeURIComponent(window.location.pathname + window.location.search));
    const data = await resp.json();
    window.location.href = data.url;
  } catch(e) { alert('无法发起钉钉登录，请重试'); }
}
async function exchangeCode(code) {
  try {
    await api('/api/auth/dd-code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
    load();
  } catch(e) { alert('登录失败：' + e.message); }
}
async function checkAuth() {
  try {
    const data = await api('/api/auth/me');
    return !!data.user;
  } catch(e) { return false; }
}

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function render() {
  const root = document.getElementById('root');
  if (!drawData) {
    root.innerHTML = '<div class="loading">加载中…</div>';
    return;
  }
  if (!drawData.enabled) {
    root.innerHTML = '<div class="empty"><div class="big">🎁</div><div>抽奖尚未开启，敬请期待</div></div>';
    return;
  }
  const openStages = drawData.openStages || [];
  if (openStages.length === 0) {
    root.innerHTML = '<div class="empty"><div class="big">🎁</div><div>当前赛程尚未结算，抽奖将在赛段结束后开放</div></div>';
    return;
  }

  const stages = drawData.stages || {};
  let totalVoted = 0, totalHits = 0, totalRemaining = drawData.totalRemaining || 0;
  Object.values(stages).forEach(s => { totalVoted += s.voted || 0; totalHits += s.hits || 0; });

  let html = `<div class="summary">
    <div class="stat"><div class="num">${totalVoted}</div><div class="lab">累计已投票</div></div>
    <div class="stat"><div class="num">${totalHits}</div><div class="lab">累计押中次数</div></div>
    <div class="stat"><div class="num">${totalRemaining}</div><div class="lab">剩余抽奖次数</div></div>
  </div>`;

  html += `<div class="card"><h2>📋 游戏规则</h2><div class="rules">${ESC(drawData.config.rules || '')}</div><div style="margin-top:12px;font-size:13px;color:#6b7280;">兑奖联系人：<strong style="color:#ff6b35;">${ESC(drawData.config.contact || '')}</strong></div></div>`;

  html += `<div class="card"><h2>🎰 选择赛程抽奖</h2>`;
  html += `<div class="stage-tabs">`;
  openStages.forEach(stage => {
    const s = stages[stage];
    const active = currentStageTab === stage ? 'active' : '';
    html += `<button class="stage-tab ${active}" onclick="switchStage('${stage}')">${STAGE_LABELS[stage] || stage}（剩余 ${s.remaining || 0}）</button>`;
  });
  html += `</div>`;

  const activeStage = currentStageTab && openStages.includes(currentStageTab) ? currentStageTab : openStages[0];
  currentStageTab = activeStage;
  const s = stages[activeStage] || {};
  html += `<div class="stage-info">
    <span>已投票：${s.voted || 0} / 5</span>
    <span>押中：${s.hits || 0}</span>
    <span>剩余抽奖：${s.remaining || 0}</span>
  </div>`;
  html += `<button class="draw-btn" id="drawBtn" onclick="doDraw('${activeStage}')" ${(s.remaining || 0) <= 0 ? 'disabled' : ''}>🎁 立即抽奖</button>`;

  html += `<div class="records">`;
  const records = (s.records || []).slice().reverse();
  if (records.length === 0) {
    html += `<div style="color:#9ca3af;font-size:13px;margin-top:12px;">暂无本赛程抽奖记录</div>`;
  } else {
    html += `<div style="font-size:13px;font-weight:600;color:#374151;margin-bottom:8px;">本赛程中奖记录</div>`;
    records.forEach(r => {
      html += `<div class="record-item"><span>${r.isWin ? '🎉' : '💨'}</span><span class="${r.isWin?'win':''}">${ESC(r.prizeName)}</span><span class="time">${formatTime(r.drawnAt)}</span></div>`;
    });
  }
  html += `</div></div>`;

  root.innerHTML = html;
}

function switchStage(stage) {
  currentStageTab = stage;
  render();
}

async function doDraw(stage) {
  const btn = document.getElementById('drawBtn');
  if (btn) btn.disabled = true;
  try {
    const data = await api('/api/draw', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ stage }) });
    // 更新本地数据
    const s = drawData.stages[stage];
    if (s) {
      s.remaining = data.remaining;
      s.records.push(data.record);
    }
    drawData.totalRemaining = Math.max(0, (drawData.totalRemaining || 0) - 1);
    render();
    showResult(data.result);
    // 中奖时立即刷新滚动公告
    if (data.result && data.result.isWin) loadWinnerTicker();
  } catch(e) {
    alert(e.message);
    render();
  }
}

function showResult(result) {
  const modal = document.getElementById('resultModal');
  const icon = document.getElementById('resultIcon');
  const title = document.getElementById('resultTitle');
  const prize = document.getElementById('resultPrize');
  const desc = document.getElementById('resultDesc');
  if (result.isWin) {
    icon.textContent = '🎉';
    title.textContent = '恭喜中奖';
    prize.textContent = result.name;
    desc.innerHTML = `请钉钉联系 <strong>${ESC(drawData.config.contact || '')}</strong> 兑奖。`;
  } else {
    icon.textContent = '💨';
    title.textContent = '谢谢参与';
    prize.textContent = '';
    desc.textContent = '别灰心，继续支持优秀作品，下次好运！';
  }
  modal.style.display = 'flex';
}

function closeModal() {
  document.getElementById('resultModal').style.display = 'none';
}

// 稀有度权重：累计中奖次数越少的奖品越稀有，滚动中出现次数越多
function prizeWeight(prizeName) {
  const count = tickerPrizeStats[prizeName] || 1;
  if (count <= 2) return 3;   // 稀有奖品：重复 3 次
  if (count <= 5) return 2;   // 较稀有：重复 2 次
  return 1;                    // 常见奖品：出现 1 次
}

function renderWinnerTicker() {
  const ticker = document.getElementById('winnerTicker');
  const itemsEl = document.getElementById('winnerItems');
  if (!ticker || !itemsEl) return;
  if (!recentWins || recentWins.length === 0) {
    ticker.style.display = 'none';
    return;
  }
  // 按稀有度加权展开
  const weighted = [];
  for (const w of recentWins) {
    const n = prizeWeight(w.prizeName);
    for (let i = 0; i < n; i++) weighted.push({ ...w, rare: n >= 3 });
  }
  // 打散排列，避免同一稀有奖品连成一串
  for (let i = weighted.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [weighted[i], weighted[j]] = [weighted[j], weighted[i]];
  }
  // 复制一份实现无缝滚动
  const list = [...weighted, ...weighted];
  itemsEl.innerHTML = list.map(w => `<div class="item"${w.rare ? ' style="color:#c2410c;"' : ''}>${w.rare ? '✨ ' : ''}恭喜 <span>${ESC(w.userName)}</span> 抽中 <span>${ESC(w.prizeName)}</span> · ${ESC(w.stageLabel || STAGE_LABELS[w.stage] || w.stage || '')}</div>`).join('');
  // 内容变多时适当加长滚动周期，保持可读速度
  const duration = Math.max(48, Math.round(list.length * 3.5));
  itemsEl.style.animationDuration = duration + 's';
  ticker.style.display = 'flex';
}

async function loadWinnerTicker() {
  try {
    const data = await api('/api/draw/recent-wins?limit=20');
    const wins = data.wins || [];
    // 只有出现新中奖记录时才重建滚动（签名变化），避免动画每 15 秒重启
    const sig = wins.length ? (wins[0].userName + '|' + wins[0].prizeName + '|' + wins[0].drawnAt) + '#' + wins.length : '';
    if (sig !== tickerSignature) {
      tickerSignature = sig;
      recentWins = wins;
      tickerPrizeStats = data.prizeStats || {};
      renderWinnerTicker();
    }
  } catch(e) { console.error('loadWinnerTicker error:', e); }
}

async function load() {
  const authed = await checkAuth();
  const root = document.getElementById('root');
  if (!authed) {
    root.innerHTML = '<div class="login-box"><div class="big" style="font-size:48px;margin-bottom:16px;">🔒</div><p style="margin-bottom:20px;color:#6b7280;">查看抽奖信息需先登录</p><button onclick="ddLogin()">钉钉登录</button></div>';
    return;
  }
  try {
    drawData = await api('/api/draw/status');
    render();
    loadWinnerTicker();
    // 实时刷新滚动公告：每 15 秒检查一次新中奖记录
    setInterval(loadWinnerTicker, 15000);
  } catch(e) {
    root.innerHTML = '<div class="empty"><div class="big">⚠️</div><div>加载失败：' + ESC(e.message) + '</div></div>';
  }
}

load();
</script>
</body>
</html>
